<title>Pomo Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column. Home = mascot greeting, level bar, 2x2 game tiles.
   Game = prompt card, three big answer buttons, mascot buddy at the bottom. */
:root{
  --bg:#D9EEFF; --surface:#FFFFFF; --ink:#16255A; --muted:#4D5E8F; --line:#B3CFEA; --shade:#9DBBDB;
  --pomo:#3DCFA0; --sun:#FFC53D; --coral:#FF6B6B; --sky:#4AA8FF; --violet:#9A6BFF;
  --good-bg:#D3F6E6; --bad-bg:#FFE1E1;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1736; --surface:#1A2756; --ink:#EEF3FF; --muted:#AAB9E8; --line:#2D3D7B; --shade:#0A1230;
    --good-bg:#12503E; --bad-bg:#5A2331; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1736; --surface:#1A2756; --ink:#EEF3FF; --muted:#AAB9E8; --line:#2D3D7B; --shade:#0A1230;
  --good-bg:#12503E; --bad-bg:#5A2331; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.4;
  padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:grid;gap:14px}
#app[lang="ar"]{--display:'Baloo Bhaijaan 2','Fredoka',system-ui,sans-serif;--body:'Baloo Bhaijaan 2','Nunito',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
h2,p{margin:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:24px}
.brand svg{width:38px;height:38px}
.tools{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;min-height:44px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pill svg{width:26px;height:26px}
.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.18)}}

.btn,.chip{background:var(--surface);border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;min-height:44px;padding:0 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.chip:active,.ans:active,.game-card:active{transform:translateY(3px);border-bottom-width:3px}
.chip{border-radius:16px;border-bottom-width:5px;padding:0 12px}
.chip.icon{width:48px;padding:0}
.chip svg{width:22px;height:22px}
.btn.primary{background:var(--sun);border-color:#E0A41F;color:#16255A;font-family:var(--display);font-size:20px;min-height:54px}
[dir="rtl"] .flip{transform:scaleX(-1)}

.hero{display:flex;align-items:center;gap:12px}
.pomo-wrap{flex:none;width:104px}
.pomo-wrap svg{width:100%;height:auto;display:block}
.pomo-wrap.sm{width:76px}
.pomo-wrap.big{width:170px;margin-inline:auto}
.bubble{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:12px 16px;font-family:var(--display);font-weight:600;font-size:19px;min-width:0;flex:1}
.bubble.sm{font-size:17px;padding:8px 14px;min-height:44px;display:flex;align-items:center}
.bubble:empty{visibility:hidden}

.level{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.lvl-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.lvl-row b{font-family:var(--display);font-size:20px}
.lvl-row span{color:var(--muted)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-card{background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;border-radius:24px;padding:14px;display:grid;gap:4px;align-content:start;text-align:start;min-width:0}
.tile{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin-bottom:6px}
.tile svg{width:44px;height:44px}
.gt{font-family:var(--display);font-weight:700;font-size:22px}
.gs{color:var(--muted);font-size:14px;line-height:1.3}

.play{display:grid;gap:14px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:transparent}
.dot.done{background:var(--sun);border-color:#E0A41F}
.dot.now{border-color:var(--ink)}
.stage{background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:16px;display:grid;gap:12px;text-align:center}
.prompt{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.25;text-wrap:balance}
.visual{min-height:130px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center}
.visual .it{width:64px}
.visual .it svg{width:100%;height:auto;display:block}
.visual.word{flex-direction:column;align-items:center;gap:4px}
.emoji{font-size:84px;line-height:1.1}
.word-text{font-family:var(--display);font-weight:700;font-size:34px}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ans{background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;border-radius:24px;min-height:100px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:44px;padding:8px;min-width:0}
.ans svg{width:68px;height:68px}
.ans.good{background:var(--good-bg);border-color:var(--pomo)}
.ans.bad{background:var(--bad-bg);border-color:var(--coral);animation:shake .4s;opacity:.7}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.buddy{display:flex;align-items:center;gap:10px}

.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:1;background:none;border:0;padding:0;perspective:600px;min-width:0}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.mcard.open .inner,.mcard.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);border-bottom-width:6px}
.face.back{background:var(--violet);border-color:#7A4FE0}
.face.back svg{width:46%;height:46%}
.face.front{background:var(--surface);transform:rotateY(180deg);font-size:44px}
.mcard.done .face.front{background:var(--good-bg);border-color:var(--pomo)}

.result{display:grid;gap:12px;text-align:center;justify-items:center;padding-top:8px}
.result h2{font-family:var(--display);font-weight:700;font-size:34px}
.stars-row{display:flex;gap:6px;justify-content:center}
.stars-row svg{width:40px;height:40px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

.sheet{position:fixed;inset:0;background:rgba(10,18,48,.6);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet-card{background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:26px;padding:20px;width:100%;max-width:420px;display:grid;gap:14px}
.sheet-card h2{font-family:var(--display);font-size:26px}
.sheet-card input[type="text"]{font:inherit;font-size:24px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;padding:10px;min-height:56px;width:100%;background:var(--bg);color:var(--ink)}
.msg{color:var(--coral);font-size:15px;min-height:1.4em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:64px;min-height:36px;border-radius:99px;border:3px solid var(--line);background:var(--bg);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch[aria-checked="true"]{background:var(--pomo);border-color:#25A981}
.switch[aria-checked="true"]::after{inset-inline-start:30px;background:#fff}
.small{font-size:14px;color:var(--muted)}

@media (max-width:380px){.ans{font-size:38px;min-height:88px}.ans svg{width:56px;height:56px}.pomo-wrap{width:84px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" lang="en" dir="ltr">
  <header class="top">
    <div class="brand"><span id="brandMark"></span><span>Pomo Play</span></div>
    <div class="tools">
      <div class="pill" id="starPill" aria-live="polite"><span id="pillStar"></span><span id="starCount">0</span></div>
      <button class="chip" id="langBtn" type="button"></button>
      <button class="chip icon" id="gearBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="sheet" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="sheet-card" id="gateCard"></div>
</div>

<script>
(function(){
"use strict";
var KEY="pomo-play-v1";
var INK="#16255A";
var PAL=["#FF6B6B","#3E7BFA","#2FB67C","#FFC53D","#8E5CF7","#FF8A3D"];
var S={lang:(navigator.language||"en").toLowerCase().indexOf("ar")===0?"ar":"en",stars:0,sound:true};
try{var saved=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(saved.lang)S.lang=saved.lang; if(typeof saved.stars==="number")S.stars=saved.stars; if(typeof saved.sound==="boolean")S.sound=saved.sound;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function num(n){return S.lang==="ar"?String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d];}):String(n);}

var COLORS=[
  {k:"red",hex:"#E5484D",en:"red",m:"أحمر",f:"حمراء"},
  {k:"blue",hex:"#3E7BFA",en:"blue",m:"أزرق",f:"زرقاء"},
  {k:"green",hex:"#2FB67C",en:"green",m:"أخضر",f:"خضراء"},
  {k:"yellow",hex:"#FFC53D",en:"yellow",m:"أصفر",f:"صفراء"},
  {k:"purple",hex:"#8E5CF7",en:"purple",m:"بنفسجي",f:"بنفسجية"},
  {k:"orange",hex:"#FF8A3D",en:"orange",m:"برتقالي",f:"برتقالية"}
];
var SHAPES=[
  {k:"circle",en:"circle",ar:"دائرة",fem:true},
  {k:"square",en:"square",ar:"مربع",fem:false},
  {k:"triangle",en:"triangle",ar:"مثلث",fem:false},
  {k:"star",en:"star",ar:"نجمة",fem:true}
];

var LET={
  en:[["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Egg","🥚"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],["L","Lion","🦁"],["M","Moon","🌙"],["S","Sun","☀️"],["T","Tree","🌳"]],
  ar:[["أ","أرنب","🐰"],["ب","بطة","🦆"],["ت","تفاحة","🍎"],["ج","جمل","🐪"],["ح","حصان","🐴"],["د","دب","🐻"],["ز","زرافة","🦒"],["س","سمكة","🐟"],["ش","شمس","☀️"],["ف","فيل","🐘"],["ق","قمر","🌙"],["ك","كلب","🐶"],["ن","نحلة","🐝"]]
};

var TX={
 en:{
  hello:"Hi, I'm Pomo! What shall we play?",
  level:function(n){return "Level "+n;},
  toNext:function(n){return n+" more "+(n===1?"star":"stars")+" to the next level";},
  games:{count:["Count","Fish and balloons"],letters:["Letters","First letter of a word"],shapes:["Shapes","Colors and shapes"],memory:["Memory","Match the pairs"]},
  back:"Home",listen:"Listen again",grown:"Grown-ups",again:"Play again",home:"Home",great:"Great job!",
  earned:function(n){return n===0?"Nice practice! Try again for stars.":"You earned "+n+" "+(n===1?"star":"stars");},
  oops:"Almost! Try another one.",yay:["Yes!","Super!","You got it!","Great!"],
  countQ:function(item){return "How many "+(item==="fish"?"fish":"balloons")+"?";},
  letterQ:"Which letter does this word start with?",
  shapeQ:function(c,s){return "Tap the "+c.en+" "+s.en;},
  memQ:"Find the matching pairs",moves:function(n){return "Moves: "+n;},
  gateTitle:"For grown-ups",gateQ:function(a,b){return "What is "+a+" + "+b+"?";},check:"Open",wrong:"That is not right. Try again.",
  sound:"Sound and voice",reset:"Reset stars",resetSure:"Tap again to reset",
  privacy:"Stars are saved only on this device. This app has no ads, accounts or purchases.",close:"Close",langBtn:"عربي",card:"Card"
 },
 ar:{
  hello:"أهلاً، أنا بومو! ماذا نلعب اليوم؟",
  level:function(n){return "المستوى "+num(n);},
  toNext:function(n){return "باقي "+num(n)+" من النجوم للمستوى التالي";},
  games:{count:["العدّ","الأسماك والبالونات"],letters:["الحروف","أول حرف في الكلمة"],shapes:["الأشكال","الألوان والأشكال"],memory:["الذاكرة","جد الأزواج"]},
  back:"الرئيسية",listen:"استمع مرة أخرى",grown:"للكبار",again:"العب مجدداً",home:"الرئيسية",great:"أحسنت!",
  earned:function(n){return n===0?"تدريب جميل! جرّب مجدداً لتربح نجوماً":n===1?"ربحت نجمة واحدة":n===2?"ربحت نجمتين":"ربحت "+num(n)+" نجوم";},
  oops:"قريب! جرّب مرة أخرى.",yay:["نعم!","رائع!","أحسنت!","ممتاز!"],
  countQ:function(item){return "كم "+(item==="fish"?"سمكة":"بالونة")+"؟";},
  letterQ:"بأي حرف تبدأ هذه الكلمة؟",
  shapeQ:function(c,s){return "المس "+s.ar+" "+(s.fem?c.f:c.m);},
  memQ:"جد الأزواج المتشابهة",moves:function(n){return "الحركات: "+num(n);},
  gateTitle:"للكبار فقط",gateQ:function(a,b){return "كم يساوي "+num(a)+" + "+num(b)+"؟";},check:"فتح",wrong:"ليست صحيحة. حاول مجدداً.",
  sound:"الصوت والنطق",reset:"إعادة ضبط النجوم",resetSure:"اضغط مرة أخرى للتأكيد",
  privacy:"تُحفظ النجوم على هذا الجهاز فقط. لا إعلانات ولا حسابات ولا مشتريات.",close:"إغلاق",langBtn:"English",card:"بطاقة"
 }
};
function T(){return TX[S.lang];}

function $(s,r){return (r||document).querySelector(s);}
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- audio ---------- */
var ac=null;
function tone(f,d,when,type){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(when||0);
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.05);
  }catch(e){}
}
function sfx(k){
  if(!S.sound)return;
  if(k==="good"){tone(660,.14,0);tone(880,.22,.12);}
  else if(k==="bad"){tone(220,.22,0,"triangle");}
  else if(k==="flip"){tone(520,.07,0);}
  else if(k==="win"){tone(523,.16,0);tone(659,.16,.15);tone(784,.16,.3);tone(1047,.35,.45);}
}
function speak(text,force){
  if(!S.sound&&!force)return;
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=S.lang==="ar"?"ar-SA":"en-US";u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- drawings ---------- */
function starPts(cx,cy,R,r){
  var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));}
  return p.join(" ");
}
function starSVG(fill,stroke){
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+starPts(50,53,44,19)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="6" stroke-linejoin="round"/></svg>';
}
function mascot(mood){
  var eyes=mood==="cheer"
    ?'<path d="M34 60 Q44 48 54 60" fill="none" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/><path d="M66 60 Q76 48 86 60" fill="none" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"/>'
    :'<circle cx="44" cy="60" r="11" fill="#fff"/><circle cx="76" cy="60" r="11" fill="#fff"/><circle cx="46" cy="62" r="5.5" fill="'+INK+'"/><circle cx="74" cy="62" r="5.5" fill="'+INK+'"/>';
  var mouth=mood==="cheer"
    ?'<path d="M44 78 Q60 106 76 78 Z" fill="'+INK+'"/><path d="M52 91 Q60 85 68 91 Q60 97 52 91Z" fill="#FF6B6B"/>'
    :mood==="oops"
    ?'<path d="M50 90 Q60 80 70 90" fill="none" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>'
    :'<path d="M48 80 Q60 92 72 80" fill="none" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 120 120" aria-hidden="true">'
   +'<ellipse cx="60" cy="110" rx="34" ry="6" fill="#000" opacity=".12"/>'
   +'<circle cx="32" cy="24" r="12" fill="var(--pomo)"/><circle cx="88" cy="24" r="12" fill="var(--pomo)"/>'
   +'<circle cx="32" cy="24" r="6" fill="#FFB3B3"/><circle cx="88" cy="24" r="6" fill="#FFB3B3"/>'
   +'<path d="M60 14C92 14 109 40 109 68C109 95 88 109 60 109C32 109 11 95 11 68C11 40 28 14 60 14Z" fill="var(--pomo)"/>'
   +'<circle cx="28" cy="78" r="7" fill="#FF6B6B" opacity=".45"/><circle cx="92" cy="78" r="7" fill="#FF6B6B" opacity=".45"/>'
   +eyes+mouth+'</svg>';
}
function shapeSVG(shape,hex){
  var body="";
  if(shape==="circle")body='<circle cx="50" cy="50" r="40"';
  else if(shape==="square")body='<rect x="13" y="13" width="74" height="74" rx="8"';
  else if(shape==="triangle")body='<polygon points="50,10 93,88 7,88" stroke-linejoin="round"';
  else body='<polygon points="'+starPts(50,53,46,20)+'" stroke-linejoin="round"';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+body+' fill="'+hex+'" stroke="var(--ink)" stroke-width="5"/></svg>';
}
function fishSVG(c){
  return '<svg viewBox="0 0 60 40" aria-hidden="true"><ellipse cx="24" cy="20" rx="20" ry="13" fill="'+c+'"/><polygon points="40,20 58,6 58,34" fill="'+c+'"/><circle cx="14" cy="17" r="3" fill="'+INK+'"/></svg>';
}
function balloonSVG(c){
  return '<svg viewBox="0 0 40 60" aria-hidden="true"><ellipse cx="20" cy="22" rx="16" ry="20" fill="'+c+'"/><polygon points="20,41 15,49 25,49" fill="'+c+'"/><path d="M20 49 Q13 54 20 59" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>';
}
var ICON={
  count:function(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="20" cy="24" rx="15" ry="10" fill="'+INK+'"/><polygon points="32,24 46,12 46,36" fill="'+INK+'"/><circle cx="12" cy="21" r="2.5" fill="#FFC53D"/></svg>';},
  letters:function(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><text x="24" y="35" text-anchor="middle" font-size="30" font-weight="700" fill="'+INK+'" font-family="Fredoka,sans-serif">'+(S.lang==="ar"?"أب":"Aa")+'</text></svg>';},
  shapes:function(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="15" cy="15" r="9" fill="'+INK+'"/><rect x="26" y="6" width="16" height="16" rx="3" fill="'+INK+'"/><polygon points="24,26 38,43 10,43" fill="'+INK+'"/></svg>';},
  memory:function(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="20" height="28" rx="5" fill="'+INK+'"/><rect x="23" y="12" width="20" height="28" rx="5" fill="'+INK+'" opacity=".55"/><polygon points="15,17 17.2,22 22.5,22.5 18.5,26 19.8,31.3 15,28.5 10.2,31.3 11.5,26 7.5,22.5 12.8,22" fill="#FFC53D"/></svg>';}
};
var TILE={count:"#FFC53D",letters:"#FF8E8E",shapes:"#6FC4FF",memory:"#B79BFF"};
var ICONS={
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',
  chev:'<svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};

/* ---------- shell ---------- */
var app=$("#app"),view=$("#view");
function refreshShell(){
  var t=T();
  app.lang=S.lang;app.dir=S.lang==="ar"?"rtl":"ltr";
  $("#brandMark").innerHTML='<span style="display:block;width:38px">'+mascot("idle")+'</span>';
  $("#pillStar").innerHTML=starSVG("#FFC53D","#E0A41F");
  $("#starCount").textContent=num(S.stars);
  $("#langBtn").textContent=t.langBtn;
  $("#gearBtn").setAttribute("aria-label",t.grown);
}
function addStars(k){
  S.stars+=k;save();
  $("#starCount").textContent=num(S.stars);
  var p=$("#starPill");p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");
}

/* ---------- home ---------- */
function home(){
  try{speechSynthesis.cancel();}catch(e){}
  var t=T(),lvl=Math.floor(S.stars/10)+1,into=S.stars%10;
  view.innerHTML='<section>'
   +'<div class="hero"><div class="pomo-wrap">'+mascot("idle")+'</div><p class="bubble">'+t.hello+'</p></div>'
   +'<div class="level" style="margin-block:14px"><div class="lvl-row"><b>'+t.level(num(lvl)).replace(/^(.*)$/,"$1")+'</b><span>'+t.toNext(10-into)+'</span></div><div class="bar"><i style="width:'+(into*10)+'%"></i></div></div>'
   +'<div class="grid">'+["count","letters","shapes","memory"].map(function(k){
      return '<button class="game-card" type="button" data-game="'+k+'"><span class="tile" style="background:'+TILE[k]+'">'+ICON[k]()+'</span><span class="gt">'+t.games[k][0]+'</span><span class="gs">'+t.games[k][1]+'</span></button>';
    }).join("")+'</div></section>';
  Array.prototype.forEach.call(view.querySelectorAll("[data-game]"),function(b){b.onclick=function(){start(b.dataset.game);};});
}

/* ---------- question games ---------- */
var G=null;
function start(kind){
  if(kind==="memory"){startMemory();return;}
  var deck=[],i;
  if(kind==="count"){
    var last=0;
    for(i=0;i<5;i++){
      var n;do{n=rand(1,8);}while(n===last);last=n;
      var opts={};opts[n]=1;
      while(Object.keys(opts).length<3){var c=n+pick([-2,-1,1,2]);if(c>=1&&c<=9)opts[c]=1;}
      deck.push({item:pick(["fish","balloon"]),n:n,colors:shuffle(PAL),correct:n,answers:shuffle(Object.keys(opts).map(Number)).map(function(v){return {v:v,html:num(v),label:num(v)};})});
    }
  }else if(kind==="letters"){
    var pool=shuffle(LET[S.lang]).slice(0,5),all=LET[S.lang];
    deck=pool.map(function(it){
      var others=shuffle(all.filter(function(x){return x[0]!==it[0];})).slice(0,2).concat([it]);
      return {item:it,correct:it[0],answers:shuffle(others).map(function(x){
        return {v:x[0],html:S.lang==="en"?x[0]+x[0].toLowerCase():x[0],label:x[0]};
      })};
    });
  }else{
    for(i=0;i<5;i++){
      var sh=pick(SHAPES),co=pick(COLORS);
      var sh2=pick(SHAPES.filter(function(x){return x.k!==sh.k;}));
      var co2=pick(COLORS.filter(function(x){return x.k!==co.k;}));
      var list=[{s:sh,c:co},{s:sh2,c:co},{s:sh,c:co2}];
      deck.push({shape:sh,color:co,correct:sh.k+"-"+co.k,answers:shuffle(list).map(function(o){
        return {v:o.s.k+"-"+o.c.k,html:shapeSVG(o.s.k,o.c.hex),label:o.c.en+" "+o.s.en};
      })});
    }
  }
  G={kind:kind,n:0,score:0,deck:deck,tried:false,locked:false};
  showQ();
}
function topBar(doneCount,total,promptText){
  var t=T(),dots="";
  for(var i=0;i<total;i++)dots+='<span class="dot'+(i<doneCount?" done":i===doneCount?" now":"")+'"></span>';
  return '<div class="bar-top"><button class="chip" type="button" id="homeBtn">'+ICONS.chev+t.back+'</button><div class="dots" aria-hidden="true">'+dots+'</div>'
   +'<button class="chip icon" type="button" id="listenBtn" aria-label="'+t.listen+'">'+ICONS.speaker+'</button></div>';
}
function showQ(){
  var t=T(),q=G.deck[G.n],promptText,visual,i;
  G.tried=false;G.locked=false;
  if(G.kind==="count"){
    promptText=t.countQ(q.item);
    visual="";
    for(i=0;i<q.n;i++)visual+='<span class="it">'+(q.item==="fish"?fishSVG(q.colors[i%6]):balloonSVG(q.colors[i%6]))+'</span>';
    G.say=promptText;
  }else if(G.kind==="letters"){
    promptText=t.letterQ;
    visual='<div class="emoji" aria-hidden="true">'+q.item[2]+'</div><div class="word-text">'+q.item[1]+'</div>';
    G.say=promptText+" "+q.item[1];
  }else{
    promptText=t.shapeQ(q.color,q.shape);
    visual='<div class="small">&nbsp;</div>';
    G.say=promptText;
  }
  var answers=q.answers.map(function(a){return '<button class="ans" type="button" data-v="'+a.v+'" aria-label="'+a.label+'">'+a.html+'</button>';}).join("");
  view.innerHTML='<section class="play">'+topBar(G.n,G.deck.length)
   +'<div class="stage"><p class="prompt" id="prompt">'+promptText+'</p>'+(G.kind==="shapes"?"":'<div class="visual'+(G.kind==="letters"?" word":"")+'">'+visual+'</div>')+'</div>'
   +'<div class="answers">'+answers+'</div>'
   +'<div class="buddy"><div class="pomo-wrap sm" id="buddy">'+mascot("idle")+'</div><p class="bubble sm" id="say"></p></div></section>';
  $("#homeBtn").onclick=home;
  $("#listenBtn").onclick=function(){speak(G.say,true);};
  Array.prototype.forEach.call(view.querySelectorAll(".ans"),function(b){b.onclick=function(){answer(b);};});
  speak(G.say);
}
function mood(m,msg){
  var b=$("#buddy"),s=$("#say");
  if(b)b.innerHTML=mascot(m);
  if(s)s.textContent=msg||"";
}
function answer(btn){
  if(G.locked)return;
  var t=T(),q=G.deck[G.n];
  if(btn.dataset.v===String(q.correct)){
    G.locked=true;btn.classList.add("good");sfx("good");
    if(!G.tried){G.score++;addStars(1);}
    mood("cheer",pick(t.yay));
    setTimeout(function(){G.n++;if(G.n>=G.deck.length)result(G.score,5);else showQ();},1000);
  }else{
    G.tried=true;btn.classList.add("bad");btn.disabled=true;sfx("bad");mood("oops",t.oops);
  }
}

/* ---------- memory ---------- */
function startMemory(){
  var t=T();
  var emo=shuffle(["🐙","🦊","🐸","🐼","🦋","🐢","🐞","🐳"]).slice(0,4);
  var cards=shuffle(emo.concat(emo)).map(function(e,i){return {i:i,e:e,open:false,done:false};});
  var M={cards:cards,first:null,lock:false,moves:0,found:0};
  var dots="";
  view.innerHTML='<section class="play"><div class="bar-top"><button class="chip" type="button" id="homeBtn">'+ICONS.chev+t.back+'</button><div class="dots" id="mdots" aria-hidden="true"></div>'
   +'<button class="chip icon" type="button" id="listenBtn" aria-label="'+t.listen+'">'+ICONS.speaker+'</button></div>'
   +'<div class="stage"><p class="prompt">'+t.memQ+'</p><p class="small" id="moves" aria-live="polite">'+t.moves(num(0))+'</p></div>'
   +'<div class="mem">'+cards.map(function(c){
      return '<button class="mcard" type="button" data-i="'+c.i+'" aria-label="'+t.card+'"><span class="inner"><span class="face back">'+starSVG("#fff","#fff")+'</span><span class="face front" aria-hidden="true">'+c.e+'</span></span></button>';
    }).join("")+'</div>'
   +'<div class="buddy"><div class="pomo-wrap sm" id="buddy">'+mascot("idle")+'</div><p class="bubble sm" id="say"></p></div></section>';
  function dotsUpdate(){var h="";for(var i=0;i<4;i++)h+='<span class="dot'+(i<M.found?" done":"")+'"></span>';$("#mdots").innerHTML=h;}
  dotsUpdate();
  $("#homeBtn").onclick=home;
  $("#listenBtn").onclick=function(){speak(t.memQ,true);};
  var els=view.querySelectorAll(".mcard");
  Array.prototype.forEach.call(els,function(el){
    el.onclick=function(){
      var c=M.cards[+el.dataset.i];
      if(M.lock||c.open||c.done)return;
      c.open=true;el.classList.add("open");sfx("flip");
      if(!M.first){M.first=c;return;}
      M.moves++;$("#moves").textContent=t.moves(num(M.moves));
      var a=M.first,b=c;M.first=null;
      if(a.e===b.e){
        a.done=b.done=true;M.found++;
        els[a.i].classList.add("done");els[b.i].classList.add("done");
        sfx("good");mood("cheer",pick(t.yay));dotsUpdate();
        if(M.found===4){
          var st=M.moves<=6?3:M.moves<=9?2:1;
          addStars(st);
          setTimeout(function(){result(st,3);},900);
        }
      }else{
        M.lock=true;mood("oops","");
        setTimeout(function(){
          a.open=b.open=false;els[a.i].classList.remove("open");els[b.i].classList.remove("open");M.lock=false;mood("idle","");
        },850);
      }
    };
  });
  speak(t.memQ);
}

/* ---------- result ---------- */
function result(earned,max){
  var t=T(),row="",i;
  for(i=0;i<max;i++)row+=starSVG(i<earned?"#FFC53D":"none",i<earned?"#E0A41F":"var(--line)");
  var kind=G&&G.kind?G.kind:"memory";
  view.innerHTML='<section class="result"><div class="pomo-wrap big">'+mascot("cheer")+'</div><h2>'+t.great+'</h2>'
   +'<div class="stars-row" aria-hidden="true">'+row+'</div><p>'+t.earned(earned)+'</p>'
   +'<div class="actions"><button class="btn primary" type="button" id="again">'+t.again+'</button><button class="btn" type="button" id="goHome">'+t.home+'</button></div></section>';
  $("#again").onclick=function(){start(lastKind);};
  $("#goHome").onclick=home;
  sfx("win");speak(t.great);
}
var lastKind="count";
var _start=start;
start=function(k){lastKind=k;_start(k);};

/* ---------- grown-ups ---------- */
var gate=$("#gate"),gateCard=$("#gateCard"),gateAns=0;
function openGate(){
  var t=T(),a=rand(3,9),b=rand(3,9);gateAns=a+b;
  gateCard.innerHTML='<h2 id="gateTitle">'+t.gateTitle+'</h2><p>'+t.gateQ(a,b)+'</p>'
   +'<input type="text" id="gateIn" inputmode="numeric" autocomplete="off" aria-label="'+t.gateQ(a,b)+'">'
   +'<p class="msg" id="gateMsg" aria-live="polite"></p>'
   +'<div class="row"><button class="btn" type="button" id="gateClose">'+t.close+'</button><button class="btn primary" type="button" id="gateOk">'+t.check+'</button></div>';
  gate.hidden=false;
  var inp=$("#gateIn");inp.focus();
  function tryIt(){
    var v=parseInt(inp.value.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}),10);
    if(v===gateAns)openPanel();else{$("#gateMsg").textContent=t.wrong;inp.select();}
  }
  $("#gateOk").onclick=tryIt;
  inp.onkeydown=function(e){if(e.key==="Enter")tryIt();};
  $("#gateClose").onclick=closeGate;
}
function openPanel(){
  var t=T(),armed=false;
  gateCard.innerHTML='<h2 id="gateTitle">'+t.gateTitle+'</h2>'
   +'<div class="row"><span>'+t.sound+'</span><button class="switch" type="button" role="switch" id="snd" aria-checked="'+S.sound+'" aria-label="'+t.sound+'"></button></div>'
   +'<button class="btn" type="button" id="rst">'+t.reset+'</button>'
   +'<p class="small">'+t.privacy+'</p>'
   +'<button class="btn primary" type="button" id="gateClose">'+t.close+'</button>';
  $("#snd").onclick=function(){S.sound=!S.sound;save();this.setAttribute("aria-checked",String(S.sound));if(!S.sound){try{speechSynthesis.cancel();}catch(e){}}};
  $("#rst").onclick=function(){
    if(!armed){armed=true;this.textContent=t.resetSure;return;}
    S.stars=0;save();refreshShell();armed=false;this.textContent=t.reset;
    if(!$("#view .play")&&!$("#view .result"))home();
  };
  $("#gateClose").onclick=closeGate;
  $("#gateClose").focus();
}
function closeGate(){gate.hidden=true;gateCard.innerHTML="";$("#gearBtn").focus();}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!gate.hidden)closeGate();});
gate.addEventListener("click",function(e){if(e.target===gate)closeGate();});

$("#gearBtn").onclick=openGate;
$("#langBtn").onclick=function(){S.lang=S.lang==="ar"?"en":"ar";save();refreshShell();home();};

refreshShell();
home();
})();
</script>
